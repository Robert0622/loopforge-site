<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" font-family="'Inter Tight','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF9FE"/>
      <stop offset="100%" stop-color="#F3F4F9"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#008DCC"/>
      <stop offset="50%" stop-color="#526CE8"/>
      <stop offset="100%" stop-color="#8A4ED9"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14141E" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#526CE8"/>
    </marker>
  </defs>

  <!-- Outer Project Boundary -->
  <rect x="12" y="12" width="956" height="396" rx="16" fill="url(#bgGrad)" stroke="#DCDCE6" stroke-width="1.5"/>
  <rect x="28" y="26" width="236" height="28" rx="14" fill="#EEF0FF" stroke="#C9CDFD"/>
  <circle cx="44" cy="40" r="4.5" fill="#526CE8"/>
  <text x="56" y="45" font-size="12.5" font-weight="650" fill="#3246B8">项目（Project）· 独立协作空间</text>
  <text x="278" y="45" font-size="12" fill="#6E6E7A">统一管理团队成员、代码仓库、需求台账与默认 SOP</text>

  <!-- Left Card: Requirement & Entry -->
  <g filter="url(#cardShadow)">
    <rect x="34" y="82" width="190" height="220" rx="12" fill="#FFFFFF" stroke="#E4E4EE"/>
    <rect x="50" y="100" width="76" height="22" rx="6" fill="#F0EDFF"/>
    <text x="88" y="115" font-size="11" font-weight="700" fill="#684CE9" text-anchor="middle">起点 · 输入</text>
    <text x="50" y="146" font-size="16" font-weight="700" fill="#18181B">需求 / 对话想法</text>
    <text x="50" y="168" font-size="12" fill="#6C6C76">• 一句话想法或问题咨询</text>
    <text x="50" y="188" font-size="12" fill="#6C6C76">• 需求列表新建工作项</text>
    <text x="50" y="208" font-size="12" fill="#6C6C76">• 定时同步 GitHub Issues</text>
    <rect x="50" y="232" width="158" height="52" rx="8" fill="#F8F8FA" stroke="#EAE9EE"/>
    <text x="62" y="253" font-size="11.5" font-weight="600" fill="#252529">全程关联追踪</text>
    <text x="62" y="271" font-size="11" fill="#6F6F79">讨论、运行与 PR 自动归档</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 224 160 L 266 135" fill="none" stroke="#526CE8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 224 215 L 266 245" fill="none" stroke="#526CE8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Middle Top: Mode 1 Main Bot -->
  <g filter="url(#cardShadow)">
    <rect x="274" y="72" width="390" height="114" rx="12" fill="#FFFFFF" stroke="#C9CDFD" stroke-width="1.5"/>
    <rect x="292" y="88" width="96" height="22" rx="6" fill="#EEF0FF"/>
    <text x="340" y="103" font-size="11" font-weight="700" fill="#526CE8" text-anchor="middle">方式一 · 自由协作</text>
    <text x="398" y="104" font-size="15" font-weight="700" fill="#18181B">Main Bot（AI 工作台主助手）</text>
    <text x="292" y="132" font-size="12.5" fill="#52525B">多人共享同一会话；支持直接改代码提 PR、调用角色子 Agent，</text>
    <text x="292" y="152" font-size="12.5" fill="#52525B">或随时暂停、恢复、接管正在运行的 SOP 流水线。</text>
    <text x="292" y="172" font-size="11.5" font-weight="600" fill="#338768">权限保护：每次确认（默认安全卡片） / 帮我批准 / 完全权限</text>
  </g>

  <!-- Middle Bottom: Mode 2 SOP Pipeline -->
  <g filter="url(#cardShadow)">
    <rect x="274" y="202" width="390" height="126" rx="12" fill="#FFFFFF" stroke="#D9CFFD" stroke-width="1.5"/>
    <rect x="292" y="218" width="96" height="22" rx="6" fill="#F0EDFF"/>
    <text x="340" y="233" font-size="11" font-weight="700" fill="#684CE9" text-anchor="middle">方式二 · 标准流水线</text>
    <text x="398" y="234" font-size="15" font-weight="700" fill="#18181B">SOP 流程（Agent + 脚本 + 人工关口）</text>
    <!-- Mini pipeline pills -->
    <rect x="292" y="250" width="76" height="32" rx="6" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="330" y="270" font-size="11.5" font-weight="600" fill="#5B21B6" text-anchor="middle">专业角色</text>
    <text x="377" y="270" font-size="12" fill="#9A9AA4">→</text>
    <rect x="390" y="250" width="76" height="32" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="428" y="270" font-size="11.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">脚本门禁</text>
    <text x="475" y="270" font-size="12" fill="#9A9AA4">→</text>
    <rect x="488" y="250" width="82" height="32" rx="6" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="529" y="270" font-size="11.5" font-weight="600" fill="#B45309" text-anchor="middle">人工审批</text>
    <text x="579" y="270" font-size="12" fill="#9A9AA4">→</text>
    <rect x="592" y="250" width="54" height="32" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="619" y="270" font-size="11.5" font-weight="600" fill="#047857" text-anchor="middle">交付</text>
    <text x="292" y="308" font-size="11.5" fill="#6C6C76">门禁失败附带日志自动打回上游返工 · 关键节点在「待我确认」由人拍板</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 664 135 L 708 160" fill="none" stroke="#526CE8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 664 255 L 708 220" fill="none" stroke="#526CE8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right Card: Cloud Sandbox & Deliverables -->
  <g filter="url(#cardShadow)">
    <rect x="716" y="82" width="228" height="220" rx="12" fill="#FFFFFF" stroke="#E4E4EE"/>
    <rect x="732" y="100" width="110" height="22" rx="6" fill="#E8F4EE"/>
    <text x="787" y="115" font-size="11" font-weight="700" fill="#338768" text-anchor="middle">7×24 隔离运行与交付</text>
    <text x="732" y="146" font-size="16" font-weight="700" fill="#18181B">云端沙箱 &amp; 交付物</text>
    <text x="732" y="170" font-size="12" fill="#6C6C76">• Docker / Native 隔离沙箱</text>
    <text x="732" y="190" font-size="12" fill="#6C6C76">• 合盖续跑，闲置快照休眠</text>
    <text x="732" y="210" font-size="12" fill="#6C6C76">• 产物抽屉预览与 SHA-256</text>
    <text x="732" y="230" font-size="12" fill="#6C6C76">• 自动提交 GitHub PR / MR</text>
    <rect x="732" y="246" width="196" height="40" rx="8" fill="#F0EDFF"/>
    <text x="830" y="270" font-size="12" font-weight="650" fill="#684CE9" text-anchor="middle">运行后支持 0–100 分 AI 评测复盘</text>
  </g>

  <!-- Bottom Bar: 9 Executors + MCP / Rules / Skills -->
  <rect x="34" y="340" width="910" height="58" rx="10" fill="#18181B"/>
  <text x="54" y="364" font-size="12.5" font-weight="650" fill="#FFFFFF">底层引擎与能力底座 · 9 大 Coding Agent CLI</text>
  <text x="54" y="384" font-size="12" fill="#D4D4D8">CodeBuddy · Codex · Claude Code · OpenCode · Cursor · Antigravity · Kimi · Pi · DeepSeek · MCP / 规则 / 技能</text>
</svg>
